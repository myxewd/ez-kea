// Kea DHCPv4 configuration for the docker-compose deployment.
//
// This file is created ONCE, by hand (docs/deployment.md, step 5). After that
// EZ-KEA owns it: every form save rewrites it in place, backs it up first, and
// hands the result to `kea-dhcp4 -t` before keeping it. Editing it here is
// how you get started, not how you maintain it.
//
// ONE THING MUST CHANGE: the "interfaces" entry below has to name the network
// interface the daemon receives DHCP requests on. Wrong here and Kea loads
// happily and answers nothing.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["eth0"]
    },

    // Kea 2.x spelling. Kea 3.0 renamed it to "control-sockets": [{...}].
    // EZ-KEA reads both; the daemon only accepts the one its version knows.
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea-dhcp4-ctrl.sock"
    },

    "lease-database": {
      "type": "memfile",
      "lfc-interval": 3600,
      "name": "/var/lib/kea/kea-leases4.csv"
    },

    "host-reservation-identifiers": ["hw-address"],
    "valid-lifetime": 4000,
    "option-data": [],
    "subnet4": [],
    "shared-networks": [],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "severity": "INFO",
        "debuglevel": 0,
        "output_options": [
          {
            "output": "/var/log/kea/kea-dhcp4.log",
            "maxver": 8,
            "maxsize": 204800,
            "flush": true
          }
        ]
      }
    ]
  }
}
