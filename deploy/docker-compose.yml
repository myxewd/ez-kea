# deploy/docker-compose.yml - EZ-KEA as a standalone management panel.
#
# One container, no local Kea. Every Kea server it manages is a remote daemon
# reached over its own HTTP/HTTPS control channel; register each one on the
# Endpoints page (/instances) after the first login. EZ-KEA keeps its own state
# in /data: accounts, settings, backups, and one config mirror per endpoint.
#
# The bundled-Kea deployment this file used to describe is kept at the bottom,
# commented out. Uncomment it (and the local paths in the ezkea service) only
# when EZ-KEA and the daemon share a host and EZ-KEA must edit the daemon's own
# files instead of talking to it over HTTP.
#
# Typical deployment (the full walk-through is docs/deployment.md):
#
#   # 1. once, on this host
#   mkdir -p /opt/ez-kea/data
#   cp kea.env.example kea.env        # then edit it, at minimum SECRET_KEY
#   chown -R 10001:10001 /opt/ez-kea/data
#
#   # 2. start (the image is pulled, not built)
#   docker compose --env-file kea.env up -d
#
#   # 3. open http://127.0.0.1:8080, log in, then add each remote daemon on
#   #    Endpoints: name + http(s)://host:port/ (+ credentials when its HTTP
#   #    control socket requires them -- Kea 3.x refuses an unauthenticated one).
#
# Every option is spelled out rather than left to a default, and the UI is the
# only thing that needs to be reachable from outside this container.
name: ez-kea

services:
  ezkea:
    # The published image. To build it yourself instead, see ../ezkea/Dockerfile
    # and swap this for the tag you built.
    image: dreamlord2/ezkea:0.10.2.3
    container_name: ez-kea
    restart: unless-stopped
    ports:
      # Bound to a specific host address, not 0.0.0.0: the UI is the way into
      # every DHCP configuration it manages. Put nginx or Caddy in front of it.
      - "${EZ_KEA_BIND:-127.0.0.1}:${EZ_KEA_PORT:-8080}:8080"
    env_file:
      - kea.env
    environment:
      # -- this container's own state ----------------------------------------
      DATABASE_URL: sqlite:////data/ez-kea.db
      SETTINGS_FILE: /data/ez-kea-settings.json
      LOG_INDEX_DB: /data/ez-kea-logindex.db
      STATE_INDEX_DB: /data/ez-kea-stateindex.db
      BACKUP_DIR: /data/backups
      # One directory per remote endpoint: the configuration pulled with
      # config-get, the lease table pulled with lease4-get-all/lease6-get-all,
      # and that endpoint's own search index. Safe to delete; Pull rebuilds it.
      INSTANCE_DIR: /data/instances
      HOST: 0.0.0.0
      PORT: "8080"

      # -- remote endpoints only ---------------------------------------------
      # No local Kea paths are configured, and that is the point: discovery
      # finds no daemon and no explicit DHCP_CONFIG_FILE, so LOCAL_KEA4_PRESENT
      # and LOCAL_KEA6_PRESENT stay false and the UI offers only the endpoints
      # registered in /data -- there is no misleading "This installation" entry
      # pointing at a file this container cannot see.
      #
      # The application still writes a throwaway ./data/kea-dhcp4.conf skeleton
      # for pages rendered before an endpoint is selected. It is not a daemon,
      # nothing reloads it, and it carries no real configuration.
      #
      # A remote endpoint always applies over HTTP: that is an override the
      # endpoint itself carries, so this installation-wide default only matters
      # if a local instance is ever added (see the commented block below).
      KEA_RELOAD_STRATEGY: http

      # Endpoint URLs and credentials belong to each endpoint in the database,
      # not here. These two are the installation-wide fallback and stay blank
      # on purpose: no single URL could describe more than one remote daemon.
      # KEA_HTTP_URL: http://10.0.0.10:8000/
      # KEA_HTTP_URL6: http://[fd00::10]:8001/
      # KEA_HTTP_USER: admin
      # KEA_HTTP_PASSWORD: change-me

      # -- local Kea files (disabled: this is a panel-only deployment) -------
      # Setting DHCP_CONFIG_FILE makes discovery treat that path as a local
      # instance and point the editor at a file this container cannot see.
      # They are uncommented together with the `kea` service below.
      # DHCP_CONFIG_FILE: /etc/kea/kea-dhcp4.conf
      # DHCP_CONFIG_FILE_IN_CONTAINER: ""
      # DHCP_LEASES_FILE: /var/lib/kea/kea-leases4.csv
      # DHCP_LOG_FILE: /var/log/kea/kea-dhcp4.log
      # DHCP_LOG_FILE_IN_CONTAINER: ""
      # DHCP6_CONFIG_FILE: /data/kea-dhcp6.conf
      # DHCP6_LEASES_FILE: /data/kea-leases6.csv
      # DHCP6_LOG_FILE: /data/kea-dhcp6.log
      # KEA_DHCP4_CMD: kea-dhcp4
      # KEA_DHCP6_CMD: kea-dhcp6
      # KEA_CTRL_CMD: keactrl
    volumes:
      # Accounts, app settings, backups, the per-endpoint mirrors and the two
      # disposable search indexes. Own it with UID/GID 10001
      # (docs/deployment.md explains why).
      - ${EZ_KEA_ROOT:-/opt/ez-kea}/data:/data
      # The local Kea mounts. They only mean anything together with the `kea`
      # service at the bottom of this file, so they stay commented out here.
      # - ${KEA_ROOT:-/opt/ez-kea/kea}/conf:/etc/kea
      # - ${KEA_ROOT:-/opt/ez-kea/kea}/lib:/var/lib/kea:ro
      # - ${KEA_ROOT:-/opt/ez-kea/kea}/log:/var/log/kea:ro
      # - ${KEA_ROOT:-/opt/ez-kea/kea}/run:/run/kea
    stop_grace_period: 20s

  # ---------------------------------------------------------------------------
  # Bundled local Kea - disabled.
  #
  # The two-container example: EZ-KEA edits the daemon's own config file in a
  # shared volume and reloads it over its control socket. To bring it back:
  #
  #   1. uncomment this whole service and the local Kea paths in the ezkea
  #      service above (environment + volumes);
  #   2. set KEA_RELOAD_STRATEGY back to control-socket;
  #   3. create the host directories and the daemon config (docs/deployment.md,
  #      steps 1, 3 and 5).
  #
  # kea:
  #   image: ${KEA_IMAGE:-ez-kea-kea:2.2.0}
  #   container_name: kea
  #   restart: unless-stopped
  #   entrypoint: ["/usr/local/bin/kea-entrypoint.sh"]
  #   command: ["kea-dhcp4", "-c", "/etc/kea/kea-dhcp4.conf"]
  #   # No published ports: DHCP is UDP/67 broadcast traffic that has to
  #   # arrive on the host's own interface. docs/deployment.md covers running
  #   # the daemon on the host instead, which is the usual production choice.
  #   volumes:
  #     - ${KEA_ROOT:-/opt/ez-kea/kea}/conf:/etc/kea
  #     - ${KEA_ROOT:-/opt/ez-kea/kea}/lib:/var/lib/kea
  #     - ${KEA_ROOT:-/opt/ez-kea/kea}/log:/var/log/kea
  #     - ${KEA_ROOT:-/opt/ez-kea/kea}/run:/run/kea
  #   healthcheck:
  #     test: ["CMD", "kea-dhcp4", "-t", "/etc/kea/kea-dhcp4.conf"]
  #     interval: 60s
  #     timeout: 10s
  #     retries: 3
